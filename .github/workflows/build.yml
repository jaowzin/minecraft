name: Build MineMod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure x64
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item build/Release/BedrockScanner.exe package/BedrockScanner.exe
          Copy-Item build/Release/MineMod.dll package/MineMod.dll
          Copy-Item build/Release/MineModLoader.exe package/MineModLoader.exe
          Copy-Item tools/probe-v2645.ps1 package/probe-v2645.ps1
          Copy-Item README.md package/README.md

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: MineMod-win64
          path: package/*
          if-no-files-found: error
